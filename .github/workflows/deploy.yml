name: Deploy to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Deploy to Vultr
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 149.28.165.62
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -e
            cd /opt/enp
            git pull origin main
            npm install --production=false
            npm run build
            npx drizzle-kit push
            supervisorctl restart enp
            supervisorctl status enp

            # Install the separate public ENP site without altering the tracker vhost.
            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y nginx
            fi
            install -m 644 deploy/enp-public.nginx.bootstrap.conf /etc/nginx/sites-available/enp-public
            ln -sfn /etc/nginx/sites-available/enp-public /etc/nginx/sites-enabled/enp-public
            nginx -t
            systemctl reload nginx

            # Obtain/renew the public certificate after DNS routing is live.
            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y certbot
            fi
            certbot certonly --webroot \
              -w /opt/enp/dist/public/enp-review-28aug26 \
              -d elitenursepartners.com.au \
              -d www.elitenursepartners.com.au \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --keep-until-expiring

            # Switch the public site to the final HTTPS vhost.
            install -m 644 deploy/enp-public.nginx.conf /etc/nginx/sites-available/enp-public
            nginx -t
            systemctl reload nginx

            # Verify the public origin and edge response from the server.
            echo "=== ENP HTTPS CHECK ==="
            curl -sS -I --max-time 30 --max-redirs 5 https://elitenursepartners.com.au/ || true
            echo "=== ENP HTTP CHECK ==="
            curl -sS -I --max-time 30 --max-redirs 5 http://elitenursepartners.com.au/ || true
