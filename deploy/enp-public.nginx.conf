server {
    listen 80;
    server_name elitenursepartners.com.au www.elitenursepartners.com.au;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/enp/dist/public/enp-review-28aug26;
        allow all;
    }

    location / {
        return 301 https://elitenursepartners.com.au$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.elitenursepartners.com.au;

    ssl_certificate /etc/letsencrypt/live/elitenursepartners.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitenursepartners.com.au/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://elitenursepartners.com.au$request_uri;
}

server {
    listen 443 ssl http2;
    server_name elitenursepartners.com.au;

    root /opt/enp/dist/public/enp-review-28aug26;
    index index.html;
    access_log /var/log/nginx/enp-public.access.log enp_public_no_query;

    ssl_certificate /etc/letsencrypt/live/elitenursepartners.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitenursepartners.com.au/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Check the original request so serving / internally as index.html cannot loop.
    # Keep all campaign query parameters during the redirect.
    if ($request_uri ~ "^/index[.]html(?:[?]|$)") {
        return 301 https://elitenursepartners.com.au/$is_args$args;
    }

    location ~ ^/(homepage-review|provider-landing-review)\.html$ {
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
